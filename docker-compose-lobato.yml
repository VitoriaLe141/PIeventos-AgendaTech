    build: ./back
    container_name: pieventos_back
    #restart: always
    restart: unless-stopped

    environment:
      - API_PORT=4001
      - PORT=4001
      - DB_HOST=10.0.0.25
      - DB_USER=pifatec
      - DB_PASSWORD=fatec@2026
      - DB_PORT=3307
      - DB_NAME=pieventos
      - DB_DATABASE=pieventos
